# .github/workflows/main.yml
name: EBAC CI

on:
  push:
    branches: 
      - master
      - CI
  pull_request:
    branches: 
      - master
      - CI
  workflow_dispatch:

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: 1) Checkout code
        uses: actions/checkout@v4

      - name: 2) Setup Node.js & cache npm
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: npm

      - name: 3) Install dependencies
        run: npm ci

      - name: 4) Run unit tests
        run: npm test
